<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact | Geetanjali Chopade</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<nav class="navbar">

    <a href="index.html" class="logo">
        GEETANJALI<span>.</span>
    </a>

    <div class="nav-links">

        <a href="index.html">Home</a>

        <a href="about.html">About</a>

        <a href="education.html">Education</a>

        <a href="skills.html">Skills</a>

        <a href="projects.html">Projects</a>

        <a href="contact.html" class="active">
            Contact
        </a>

    </div>

</nav>

</header>


<main>

<section class="inner-page contact-page">

    <div class="page-title">

        <span>GET IN TOUCH</span>

        <h1>Contact <strong>Me</strong></h1>

        <p>
            Feel free to reach out to me for opportunities,
            collaborations or professional discussions.
        </p>

    </div>


    <div class="contact-layout">


        <div class="contact-info">


            <div class="contact-item">

                <div class="contact-icon">
                    <i class="fa-solid fa-envelope"></i>
                </div>

                <div>
                    <span>Email</span>

                    <a href="mailto:yourmail@gmail.com">
                        geetanjalichopade@gmail.com
                    </a>
                </div>

            </div>


            <div class="contact-item">

                <div class="contact-icon">
                    <i class="fa-solid fa-phone"></i>
                </div>

                <div>
                    <span>Phone</span>

                    <a href="tel:+919999999999">
                        +91 9404996032
                    </a>
                </div>

            </div>


            <div class="contact-item">

                <div class="contact-icon">
                    <i class="fa-solid fa-location-dot"></i>
                </div>

                <div>
                    <span>Location</span>

                    <strong>
                        Maharashtra, India
                    </strong>
                </div>

            </div>


            <div class="contact-social">

                <a href="#">
                    <i class="fa-brands fa-linkedin-in"></i>
                </a>

                <a href="#">
                    <i class="fa-brands fa-github"></i>
                </a>

                <a href="#">
                    <i class="fa-brands fa-instagram"></i>
                </a>

            </div>

        </div>


        <div class="contact-form">

            <form>

                <div class="form-row">

                    <input
                        type="text"
                        placeholder="Your Name"
                        required>

                    <input
                        type="email"
                        placeholder="Your Email"
                        required>

                </div>


                <input
                    type="text"
                    placeholder="Subject"
                    required>


                <textarea
                    rows="7"
                    placeholder="Your Message"
                    required></textarea>


                <button type="submit" class="btn primary-btn">

                    Send Message

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </form>

        </div>


    </div>

</section>

</main>

</body>
</html>
